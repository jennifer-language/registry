[package]
name = "registry"
version = "0.1.0"
description = "the jennifer deck registry - HTTP repository and operator CLI"
license = "LGPL-3.0-only"
authors = ["mplx <jennifer@mplx.dev"]
keywords = ["registry", "decks", "jennifer"]
bin = "bin/deckadmin"

[package.urls]
deck = "https://raw.githubusercontent.com/jennifer-language/registry/main/deck.toml"

# The registry serves HTTP and shells out to nothing, so it needs `net` only.
capabilities = ["net"]

# Needs the webapi / web engine, flatdb, args, and the semver range surface.
# Matches the pragma-jennifer-version floor every .j file declares.
[engines]
jennifer = ">=0.25.0"

[decks]
