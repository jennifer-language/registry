# Grimoire book configuration for the specifications: the normative server
# and client contracts.
#
#     grimoire build --config grimoire-specs.toml
#
# A separate book from the reference: the reference describes what this
# implementation does, these what any implementation must do. The client half
# belongs to the jvc team and is held here until it moves; as its own book, the
# move is a directory rename.

[book]
title = "Jennifer Deck Registry - Specifications"
description = "The normative server and client specifications for a Jennifer deck registry."
authors = [""]
authorsLabel = "Maintained by"
language = "en"
src = "specs"

[build]
# Named for the URL path, like the other two books: /specs/specs-server.html
# must live at public/specs/specs-server.html.
out = "public/specs"

[html]
# Monospace throughout. A specification is read like an RFC: by section number,
# in fixed columns, prose and payload examples in one measure. The proportional
# themes of the other two books make wire format harder to scan. `terminal` is
# the only built-in theme that sets a monospace face for body text as well as
# code.
theme = "terminal"
mode = "auto"
# Deeper than the other books: these documents nest to x.y.z and a reader
# navigating by section number needs the numbers in the sidebar.
tocDepth = 4
# Off. Both documents number their own sections in their headings, and every
# cross-reference is by that number; automatic numbering would add a second,
# conflicting number to each section.
sectionNumbers = false
repoUrl = "https://github.com/jennifer-language/registry"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/registry/edit/main/specs/{path}"
titleUrl = "/"

[highlight]
enabled = true

[highlightjs]
enabled = false

[search]
enabled = true

[pdf]
enabled = false
