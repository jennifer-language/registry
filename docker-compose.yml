# Docker Compose for the jvc deck repository website.
#
#   docker compose up -d --build      # build the image and start the repository
#   docker compose logs -f            # follow the server console
#   docker compose exec jvc jennifer run bin/deckadmin list    # maintain the registry
#   docker compose down               # stop
#
# The registry database is bind-mounted from ./data, so deckadmin edits survive
# restarts and are readable on the host. A missing file opens as an empty
# registry, so there is nothing to seed.
#
# The same directory holds registry.log, which both the server and deckadmin
# append to; `tail -f data/registry.log` on the host shows publishes and
# requests together. Nothing rotates it; point logrotate at it.

services:
  jvc:
    build:
      context: .
      args:
        # Who the server runs as inside the container. ./data is bind-mounted
        # below and keeps host ownership, so the container's uid must match it
        # or every write is denied. Defaults suit a rootless setup; override for
        # any other host user:
        #
        #     REGISTRY_UID=$(id -u) REGISTRY_GID=$(id -g) docker compose up -d --build
        #
        # Not named UID/GID because bash makes UID readonly and does not export
        # it, so ${UID} here would resolve to nothing.
        UID: ${REGISTRY_UID:-1000}
        GID: ${REGISTRY_GID:-1000}
    image: jvc-repository:latest
    container_name: jvc-repository
    ports:
      - "8080:8080"
      # Uncomment with TLS enabled. The HTTP-01 challenge requires port 80: the
      # CA connects there, and it must reach the plain listener, not a redirect.
      # - "80:8080"
      # - "443:8443"
    environment:
      REGISTRY_ADDR: ":8080"
      REGISTRY_DB: "/app/data/decks.json"

      # The operational log. It goes to the container's stdout (`docker compose
      # logs`) and to a file beside the database, the one place both this
      # server and a `deckadmin` run through `docker compose exec` can write.
      # The server never sees a publish and deckadmin never sees a request, so
      # only the shared file shows both.
      REGISTRY_LOG: "/app/data/registry.log"

      # debug adds nothing here by itself; the access log has its own switch
      # below, since it is wanted at info far more often than the rest of debug.
      REGISTRY_LOG_LEVEL: "info"

      # logfmt for the file, for later parsing. The console is always
      # human-readable text. Set "json" to ship it onward.
      REGISTRY_LOG_FORMAT: "logfmt"

      # One line per request. Off by default: the healthcheck below polls every
      # 30s, and in an idle deployment that is the entire log. Turn it on while
      # debugging a client, or when something else rotates the file.
      REGISTRY_LOG_REQUESTS: "0"

      # The token exchange, off unless both of the next two are non-empty. They
      # come from .env (gitignored); without it they substitute to empty and the
      # registry stays read-only. Register the OAuth app at
      # github.com/settings/applications/new, enable its device flow, then
      # `cp .env.example .env` and fill it in.
      #
      # No client secret: the device grant is a public-client flow and sends
      # none. REGISTRY_IDENTITY_SECRET exists only for providers that require one.
      REGISTRY_IDENTITY: "github"
      REGISTRY_IDENTITY_CLIENTID: "${REGISTRY_IDENTITY_CLIENTID:-}"
      REGISTRY_TOKEN_KEY: "${REGISTRY_TOKEN_KEY:-}"
      # Every REGISTRY_* variable is also read from <NAME>_FILE, a file holding
      # the value, so a secret need not sit in the environment (visible in
      # `docker inspect` and to every child process). With a compose secret:
      # REGISTRY_TOKEN_KEY_FILE: /run/secrets/registry_token_key

      # Which forge a publish reads repositories from: resolving a tag to a
      # commit and reading deck.toml at it. Independent of identity above; the
      # two coincide only on github.com.
      REGISTRY_FORGE: "github"

      # Publishing from CI with no stored credential (specification 8.9). With
      # the audience set to something specific to this registry (its hostname,
      # for example), a CI job publishes by presenting the identity token its
      # runner mints, with no secret in the pipeline. Not confidential: the
      # discovery document advertises it, since a job names it when minting the
      # token. Unset leaves trusted publishing off.
      REGISTRY_TRUSTPUB_AUDIENCE: "${REGISTRY_TRUSTPUB_AUDIENCE:-}"
      REGISTRY_TRUSTPUB_PROVIDER: "github-actions"
      # HTTPS with a Let's Encrypt certificate, stored in the data volume beside
      # the database. Off by default. The HTTP-01 challenge needs the plain
      # listener reachable from the internet on port 80, so with TLS on uncomment
      # the port mappings above to publish 80 and 443 as well as 8080.
      #
      # Point REGISTRY_ACME_DIRECTORY at staging until the DNS and firewall are right;
      # production rate limits are per domain per week.
      REGISTRY_TLS: "${REGISTRY_TLS:-0}"
      REGISTRY_TLS_DOMAINS: "${REGISTRY_TLS_DOMAINS:-}"
      REGISTRY_TLS_EMAIL: "${REGISTRY_TLS_EMAIL:-}"
      REGISTRY_ACME_AGREE_TOS: "${REGISTRY_ACME_AGREE_TOS:-0}"
      REGISTRY_ACME_DIRECTORY: "${REGISTRY_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}"
      REGISTRY_TLS_ADDR: ":8443"
    volumes:
      - ./data:/app/data
      # Optional config.toml. Everything it sets can also be set above, and the
      # environment wins.
      # - ./config.toml:/app/config.toml:ro
    healthcheck:
      # The interpreter image has no curl; the probe is a Jennifer program.
      test: ["CMD", "jennifer", "run", "/app/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
